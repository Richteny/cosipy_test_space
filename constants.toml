[GENERAL]
dt = 3600
max_layers = 200 #75
z = 2.0

[PARAMETERIZATIONS]
stability_correction = "MO"
albedo_method = "Bougamont05"
densification_method = "Ligtenberg-vanKampenhout" #Ligtenberg11,Boone, Vionnet, empirical, Ligtenberg-vanKampenhout
penetrating_method = "Bintanja95"
roughness_method = "Moelg12"
saturation_water_vapour_method = "Sonntag90"
