specific_heat_method = "Yen81" #bulk, Yen81
preferential_percolation_method = "Marchenko17" # Marchenko17 or disabled aka behaviour as usual
preferential_percolation_depth = 6.0 # as in Kronenberg et al. 3.0 = FRICOSIPY and Marchenko17

[INITIAL_CONDITIONS]
initial_snowheight_constant = 0.0
initial_snow_layer_heights = 0.25 #matching maximum_snow_layer_height 0.1
